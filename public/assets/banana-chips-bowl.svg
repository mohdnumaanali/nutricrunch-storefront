<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bananaBowlBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="65%" stop-color="#FBF4DD" />
      <stop offset="100%" stop-color="#EFE1B8" />
    </radialGradient>
    <radialGradient id="ceramicBowl" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#56783B" />
      <stop offset="60%" stop-color="#2D451B" />
      <stop offset="100%" stop-color="#15240B" />
    </radialGradient>
    <filter id="shadowHeavyChips">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#141E11" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bananaBowlBg)" rx="24" />

  <!-- Banana Leaf Background Plate -->
  <path d="M120 120 C240 80, 480 140, 520 320 C460 480, 240 540, 100 440 C60 300, 80 180, 120 120 Z" fill="#698F45" opacity="0.2" />
  <path d="M120 120 Q300 320 500 340" stroke="#56783B" stroke-width="2" fill="none" opacity="0.3" />

  <!-- Shadow below bowl -->
  <ellipse cx="300" cy="380" rx="200" ry="80" fill="#1B2B16" opacity="0.18" />

  <!-- Forest Green Ceramic Bowl -->
  <g filter="url(#shadowHeavyChips)">
    <ellipse cx="300" cy="310" rx="195" ry="115" fill="url(#ceramicBowl)" stroke="#1A2D0F" stroke-width="3" />
    <!-- Inner Rim Depth -->
    <ellipse cx="300" cy="305" rx="180" ry="100" fill="#0C1706" />

    <!-- Heap of Crispy Golden Plantain Chips -->
    <g transform="translate(300, 300)">
      <!-- Multiple Crisp Chips Angled Realistically -->
      <!-- Chip 1 -->
      <ellipse cx="-70" cy="-20" rx="42" ry="32" fill="#F8DE76" stroke="#D3B038" stroke-width="2" transform="rotate(-25)" />
      <circle cx="-70" cy="-20" r="4" fill="#C79F22" />
      
      <!-- Chip 2 -->
      <ellipse cx="65" cy="-25" rx="44" ry="33" fill="#F3D55A" stroke="#CBA425" stroke-width="2" transform="rotate(35)" />
      <circle cx="65" cy="-25" r="4" fill="#B38E16" />

      <!-- Chip 3 -->
      <ellipse cx="0" cy="-45" rx="45" ry="32" fill="#F7DC6F" stroke="#D3B038" stroke-width="2" transform="rotate(-5)" />
      <circle cx="0" cy="-45" r="4" fill="#C79F22" />

      <!-- Chip 4 (Center Front) -->
      <ellipse cx="-20" cy="5" rx="48" ry="34" fill="#F9E282" stroke="#DCBA45" stroke-width="2" transform="rotate(12)" />
      <circle cx="-20" cy="5" r="4.5" fill="#C79F22" />

      <!-- Chip 5 (Front Right) -->
      <ellipse cx="40" cy="15" rx="46" ry="33" fill="#F5D760" stroke="#CBA425" stroke-width="2" transform="rotate(-18)" />
      <circle cx="40" cy="15" r="4" fill="#B38E16" />

      <!-- Fresh Coconut Slice in Bowl -->
      <path d="M-80 -60 C-60 -90, 0 -85, 20 -60 C0 -55, -50 -55, -80 -60 Z" fill="#FFFFFF" stroke="#684724" stroke-width="2" />
      <path d="M-78 -58 Q-30 -54 18 -58" stroke="#ECE0D1" stroke-width="2" fill="none" />
    </g>
  </g>

  <!-- Editorial Caption Tag in Bottom Corner -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="300" height="42" rx="8" fill="#123D24" opacity="0.95" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FFF9E9">
      Thin Sliced & Cooked in Cold-Pressed Coconut Oil
    </text>
  </g>
</svg>
