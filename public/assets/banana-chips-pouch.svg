<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9EE" />
      <stop offset="100%" stop-color="#F3E9CD" />
    </linearGradient>

    <!-- Pouch Body Gradient -->
    <linearGradient id="bananaPouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2DE94" />
      <stop offset="25%" stop-color="#F8EBB5" />
      <stop offset="50%" stop-color="#FCF4D0" />
      <stop offset="75%" stop-color="#F8EAB0" />
      <stop offset="100%" stop-color="#E9D178" />
    </linearGradient>

    <!-- Warm Orange Accent -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C76525" />
      <stop offset="100%" stop-color="#9C440E" />
    </linearGradient>

    <!-- Coconut Green -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56783B" />
      <stop offset="100%" stop-color="#2D451B" />
    </linearGradient>

    <!-- Pouch Shadow -->
    <filter id="pouchShadowBanana" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2B2814" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="600" height="600" fill="url(#bgBanana)" rx="24" />

  <!-- Backdrop Plate -->
  <ellipse cx="300" cy="520" rx="200" ry="24" fill="#3B3512" opacity="0.12" />

  <!-- Stand-up Pouch Group -->
  <g filter="url(#pouchShadowBanana)">
    <!-- Pouch Body -->
    <path d="M175 490 Q300 522 425 490 L445 130 Q300 120 155 130 Z" fill="url(#bananaPouchGrad)" stroke="#DFCA74" stroke-width="2" />

    <!-- Top Heat Seal & Tear Notches -->
    <path d="M155 130 Q300 120 445 130 L450 90 Q300 80 150 90 Z" fill="#E2CC77" />
    <line x1="150" y1="98" x2="450" y2="98" stroke="#BAA551" stroke-width="1.5" stroke-dasharray="4 2" />
    <line x1="152" y1="104" x2="448" y2="104" stroke="#BAA551" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="152,112 160,115 152,118" fill="#9E893B" />
    <polygon points="448,112 440,115 448,118" fill="#9E893B" />

    <!-- Center Label Area -->
    <rect x="180" y="145" width="240" height="325" rx="12" fill="#FFFFFF" opacity="0.95" stroke="#E6DAC0" stroke-width="1.5" />
    
    <!-- Top Forest Green Stripe on Label -->
    <path d="M180 145 H420 V205 H180 Z" fill="#123D24" rx="10" />

    <!-- Brand Header -->
    <text x="300" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#FFF9E9" letter-spacing="1">
      NUTRI<tspan fill="#C76525">CRUNCH</tspan>
    </text>
    <text x="300" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#E8DEC4" letter-spacing="1.5">
      REAL INGREDIENTS · HONEST GOODNESS
    </text>

    <!-- Warm Orange Accent Line -->
    <rect x="200" y="215" width="200" height="4" fill="url(#orangeGrad)" rx="2" />

    <!-- Product Title -->
    <text x="300" y="242" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="21" fill="#123D24">
      BANANA CHIPS
    </text>
    <text x="300" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#56783B">
      KERALA STYLE · COLD-PRESSED COCONUT OIL
    </text>

    <!-- Central Food Illustration Ring -->
    <circle cx="300" cy="330" r="56" fill="#FDF8EB" stroke="#DFCA74" stroke-width="2" />

    <!-- Crispy Golden Chips Graphic -->
    <g transform="translate(300, 330)">
      <!-- Plantain Chip 1 -->
      <ellipse cx="-16" cy="6" rx="22" ry="16" fill="#F4CF45" stroke="#C29D1D" stroke-width="1.5" transform="rotate(-15)" />
      <ellipse cx="-16" cy="6" rx="9" ry="7" fill="#E8BA21" opacity="0.7" transform="rotate(-15)" />
      <circle cx="-16" cy="6" r="2.5" fill="#C29D1D" />

      <!-- Plantain Chip 2 -->
      <ellipse cx="14" cy="-6" rx="20" ry="15" fill="#F8D95D" stroke="#C29D1D" stroke-width="1.5" transform="rotate(25)" />
      <ellipse cx="14" cy="-6" rx="8" ry="6" fill="#E8BA21" opacity="0.7" transform="rotate(25)" />
      <circle cx="14" cy="-6" r="2" fill="#C29D1D" />

      <!-- Fresh Coconut Slice Motif -->
      <path d="M-8 -26 C-2 -32, 16 -30, 24 -18 C16 -18, 2 -22, -8 -26 Z" fill="#FFFFFF" stroke="#684724" stroke-width="1.5" />
    </g>

    <!-- Badge Pills below graphic -->
    <g transform="translate(195, 396)">
      <!-- No Palm Oil Badge -->
      <rect x="0" y="0" width="102" height="22" rx="4" fill="#F4EDE0" stroke="#D8CA9F" stroke-width="1" />
      <text x="51" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#123D24">
        ZERO PALM OIL
      </text>

      <!-- Rock Salt Badge -->
      <rect x="108" y="0" width="102" height="22" rx="4" fill="#F4EDE0" stroke="#D8CA9F" stroke-width="1" />
      <text x="159" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#56783B">
        ROCK SALT & TURMERIC
      </text>
    </g>

    <!-- Net Weight & Veg Mark -->
    <g transform="translate(195, 432)">
      <!-- Indian Green Vegetarian Mark -->
      <rect x="4" y="8" width="18" height="18" fill="#FFFFFF" stroke="#128834" stroke-width="1.5" />
      <circle cx="13" cy="17" r="5" fill="#128834" />

      <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#20251F">
        Net Wt: 250g
      </text>

      <text x="206" y="22" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#C76525">
        Ultra Crispy
      </text>
    </g>
  </g>

  <!-- Decorative Scattered Chips Foreground -->
  <g transform="translate(90, 485)">
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="#F8D95D" stroke="#C29D1D" stroke-width="1.5" transform="rotate(35 20 20)" />
  </g>
  <g transform="translate(470, 495)">
    <ellipse cx="20" cy="15" rx="16" ry="11" fill="#F4CF45" stroke="#C29D1D" stroke-width="1.5" transform="rotate(-20 20 15)" />
  </g>
</svg>
